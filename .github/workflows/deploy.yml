name: Export Godot 4 HTML5 Web App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot 4 Engine Action
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Build & Export Godot 4 HTML5 WebAssembly App
        run: |
          mkdir -p dist
          godot --headless --export-release "Web" dist/index.html

      - name: Deploy Static WebAssembly to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
